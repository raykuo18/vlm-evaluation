[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "vlm_eval"
authors = [
    {name = "Siddharth Karamcheti", email="skaramcheti@cs.stanford.edu"},
    {name = "Suraj Nair", email="suraj.nair@tri.global"},
    {name = "Ashwin Balakrishna", email="ashwin.balakrishna@tri.global"}
]
description = "VLM Eval: Benchmark for VLMs, spanning text generation tasks from VQA to Captioning"
version = "0.0.1"
readme = "README.md"
requires-python = ">=3.8"
keywords = ["machine learning"]
license = {file = "LICENSE"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "accelerate",
    "ascii_magic",
    # Git dependencies are pinned to the full commit installed in the Mamba-MLLM eval envs
    # (superproject scripts/env/locks/vlm-eval/pip-freeze.txt). draccus moved: the old
    # github.com/dlwh/draccus URL now 301-redirects to marin-community/draccus (commit is on main,
    # version 0.11.5).
    "draccus @ git+https://github.com/marin-community/draccus@13dd58f0c67002add8a188d85ba0e74661039078",
    "gradio==3.35.2",
    "gradio_client==0.2.9",
    "pydantic==1.10.14",
    "jsonlines",
    "jinja2==3.0.3",
    "llava @ git+https://github.com/suraj-nair-tri/LLaVA@6d739ad8793bba97b51051089a295c42b400ff8b",
    "mosaicml-streaming",
    "openai",
    # `prismatic` is intentionally NOT listed. It is provided by the Mamba-MLLM superproject's own
    # editable install (`pip install -e <superproject>`), which vlm_eval/models/prismatic.py and
    # scripts/eval_runner.py import. Listing TRI-ML/prismatic-vlms here would install the upstream
    # package over it.
    "pycocotools",
    "rich",
    "scikit-image",
    # `salesforce-lavis` removed: it came from github.com/siddk/LAVIS, which has been deleted (the
    # installed commit 074a6ff28f8bac2f2d188d15634c624da83a7a03 is no longer fetchable), and no code
    # in this repo imports `lavis` (vlm_eval/util/preprocessing.py only cites it in a comment;
    # the instruct-blip family uses transformers' InstructBlip* classes). If a future code path does
    # need it, the only surviving source is upstream salesforce/LAVIS on PyPI (`salesforce-lavis`),
    # which is NOT the same code as the siddk fork and pins transformers<4.27 and timm==0.4.12, so it
    # cannot be installed alongside transformers==4.49.0 below. Do not add it back as a dependency.
    "torch>=2.1.0",
    "torchvision",
    "torchaudio",
    "transformers==4.49.0", ## Pinned to avoid namespace conflict with LLaVa models
    "webdataset",
    "pymongo",
    "spacy==3.7.3"
]

[project.optional-dependencies]
dev = [
    "black",
    "gpustat",
    "ipython",
    "pre-commit",
    "ruff",
]

[project.urls]
homepage = "https://github.com/TRI-ML/vlm-evaluation"
repository = "https://github.com/TRI-ML/vlm-evaluation"
documentation = "https://github.com/TRI-ML/vlm-evaluation"

[tool.setuptools.packages.find]
where = ["."]
exclude = ["cache"]

[tool.black]
line-length = 121
target-version = ["py38", "py39", "py310"]
preview = true

[tool.ruff]
line-length = 121
target-version = "py38"
select = ["A", "B", "C90", "E", "F", "I", "RUF", "W"]
ignore = ["B008", "F722"]

[tool.ruff.per-file-ignores]
"__init__.py" = ["E402", "F401"]
